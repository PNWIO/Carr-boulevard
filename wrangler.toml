name = "homesoncarr"
compatibility_date = "2026-09-01"
pages_build_output_dir = "dist"

# --- Bindings -----------------------------------------------------------------
# This file is the source of truth for bindings and vars (the dashboard can't set
# them when pages_build_output_dir is present). The site builds and deploys fine
# without them; the forms just fall back to email.
#
# Leads go to the lead-inbox Worker (stores in D1 + emails Ian) via a service binding.
# Deploy the lead-inbox Worker first; the binding fails to resolve until it exists.
[[services]]
binding = "LEAD_INBOX"
service = "lead-inbox"

# Optional extras, not needed for forms. Create once if wanted:
#
#   wrangler kv namespace create LEADS
#   wrangler r2 bucket create homesoncarr-docs

# [[kv_namespaces]]
# binding = "LEADS"
# id = "<paste the id wrangler prints>"

# [[r2_buckets]]
# binding = "DOCS"
# bucket_name = "homesoncarr-docs"

# --- Secrets ------------------------------------------------------------------
# Never in this file. Add in the dashboard, or:
#   wrangler pages secret put HMAC_SECRET
#   wrangler pages secret put TURNSTILE_SECRET_KEY
#
# HMAC_SECRET (signs the data-room access cookie) is still a secret you set in the
# Pages dashboard; the data-room form cannot grant access without it.
#
# No longer needed for the forms: LEAD_NOTIFY_TO, LEAD_NOTIFY_FROM, RESEND_API_KEY and
# the LEADS KV namespace. lead-inbox does the storing and emailing. The code still
# honours them as an optional second path if they happen to be set.
#
# Plain (non-secret) variable: PUBLIC_TURNSTILE_SITE_KEY — set at build time.
